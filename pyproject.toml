[project]
name = "delaware-law-skill"
version = "0.1.0"
description = "Offline-first Delaware legal materials lookup and citation validation for AI agents."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
semantic = [
    "FlagEmbedding>=1.3.0",
    "numpy>=1.26.0",
    "sentence-transformers>=3.0.0",
    "torch>=2.0.0",
]

[project.scripts]
delaware-law = "delaware_law_skill.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
